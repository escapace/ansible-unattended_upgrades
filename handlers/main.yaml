---
- name: unattended_upgrades inspect the systemd runtime
  listen: unattended_upgrades daemon-reload

  ansible.builtin.stat:
    path: /run/systemd/system
  register: unattended_upgrades_systemd_runtime
- name: unattended_upgrades reload the running systemd manager
  listen: unattended_upgrades daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - ansible_facts.get('service_mgr') == 'systemd'
    - unattended_upgrades_systemd_runtime.stat.isdir | default(false)
